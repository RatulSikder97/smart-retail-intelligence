<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5B6B7C"/>
    </marker>
  </defs>

  <!-- step template: card 150 wide, gap 26; x = 10 + i*176 -->
  <!-- connectors -->
  <g stroke="#5B6B7C" stroke-width="1.6" fill="none">
    <line x1="162" y1="150" x2="184" y2="150" marker-end="url(#arr)"/>
    <line x1="338" y1="150" x2="360" y2="150" marker-end="url(#arr)"/>
    <line x1="514" y1="150" x2="536" y2="150" marker-end="url(#arr)"/>
    <line x1="690" y1="150" x2="712" y2="150" marker-end="url(#arr)"/>
    <line x1="866" y1="150" x2="888" y2="150" marker-end="url(#arr)"/>
  </g>

  <!-- ============ STEP 1: dataset ============ -->
  <g>
    <rect x="10" y="60" width="152" height="180" rx="10" fill="#f7f9fb" stroke="#c9d6e6" stroke-width="1.2"/>
    <circle cx="86" cy="60" r="14" fill="#16385C"/>
    <text x="86" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">1</text>
    <!-- CSV file icon -->
    <g transform="translate(64,84)">
      <path d="M4 0 h28 l12 12 v34 h-40 z" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/>
      <path d="M32 0 v12 h12" fill="none" stroke="#2a78d6" stroke-width="1.6"/>
      <text x="22" y="34" text-anchor="middle" font-size="11" fill="#2a78d6" font-weight="bold">CSV</text>
    </g>
    <text x="86" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#16385C">Dataset</text>
    <text x="86" y="176" text-anchor="middle" font-size="10.5" fill="#41556E">Mendeley mgzvngzng2</text>
    <text x="86" y="191" text-anchor="middle" font-size="10.5" fill="#41556E">3 files &#183; 206 MB</text>
    <text x="86" y="206" text-anchor="middle" font-size="10.5" fill="#41556E">832,881 raw records</text>
  </g>

  <!-- ============ STEP 2: storage ============ -->
  <g>
    <rect x="186" y="60" width="152" height="180" rx="10" fill="#f7f9fb" stroke="#c9d6e6" stroke-width="1.2"/>
    <circle cx="262" cy="60" r="14" fill="#16385C"/>
    <text x="262" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">2</text>
    <!-- HDFS cylinders icon -->
    <g transform="translate(234,86)" stroke="#eda100" stroke-width="1.6" fill="#fff">
      <ellipse cx="28" cy="6" rx="24" ry="6"/>
      <path d="M4 6 v14 a24 6 0 0 0 48 0 v-14" />
      <path d="M4 20 v14 a24 6 0 0 0 48 0 v-14" />
      <path d="M4 34 v10 a24 6 0 0 0 48 0 v-10" />
    </g>
    <text x="262" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#16385C">Ingest &amp; storage</text>
    <text x="262" y="176" text-anchor="middle" font-size="10.5" fill="#41556E">HDFS: 9 datanodes,</text>
    <text x="262" y="191" text-anchor="middle" font-size="10.5" fill="#41556E">replication 2</text>
    <text x="262" y="206" text-anchor="middle" font-size="10.5" fill="#41556E">partitioned by division</text>
  </g>

  <!-- ============ STEP 3: preprocessing ============ -->
  <g>
    <rect x="362" y="60" width="152" height="180" rx="10" fill="#f7f9fb" stroke="#c9d6e6" stroke-width="1.2"/>
    <circle cx="438" cy="60" r="14" fill="#16385C"/>
    <text x="438" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">3</text>
    <!-- funnel icon -->
    <g transform="translate(412,84)">
      <path d="M0 0 h52 l-19 24 v20 l-14 8 v-28 z" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/>
    </g>
    <text x="438" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#16385C">Clean &amp; engineer</text>
    <text x="438" y="176" text-anchor="middle" font-size="10.5" fill="#41556E">GPS validation, dedup,</text>
    <text x="438" y="191" text-anchor="middle" font-size="10.5" fill="#41556E">missing-value policy,</text>
    <text x="438" y="206" text-anchor="middle" font-size="10.5" fill="#41556E">48 features / shop</text>
  </g>

  <!-- ============ STEP 4: modelling ============ -->
  <g>
    <rect x="538" y="60" width="152" height="180" rx="10" fill="#f7f9fb" stroke="#c9d6e6" stroke-width="1.2"/>
    <circle cx="614" cy="60" r="14" fill="#16385C"/>
    <text x="614" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">4</text>
    <!-- cluster-nodes icon -->
    <g transform="translate(588,84)" stroke="#2a78d6" stroke-width="1.6">
      <line x1="26" y1="26" x2="8" y2="8"/><line x1="26" y1="26" x2="46" y2="10"/>
      <line x1="26" y1="26" x2="12" y2="46"/><line x1="26" y1="26" x2="44" y2="44"/>
      <circle cx="26" cy="26" r="7" fill="#2a78d6"/>
      <circle cx="8" cy="8" r="5" fill="#1baf7a" stroke="#1baf7a"/>
      <circle cx="46" cy="10" r="5" fill="#eda100" stroke="#eda100"/>
      <circle cx="12" cy="46" r="5" fill="#e34948" stroke="#e34948"/>
      <circle cx="44" cy="44" r="5" fill="#4a3aa7" stroke="#4a3aa7"/>
    </g>
    <text x="614" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#16385C">Model RQ1&#8211;RQ4</text>
    <text x="614" y="176" text-anchor="middle" font-size="10.5" fill="#41556E">K-Means &#183; XGBoost</text>
    <text x="614" y="191" text-anchor="middle" font-size="10.5" fill="#41556E">SMOTE &#183; IForest + LOF</text>
    <text x="614" y="206" text-anchor="middle" font-size="10.5" fill="#41556E">(MLlib on Spark)</text>
  </g>

  <!-- ============ STEP 5: evaluation ============ -->
  <g>
    <rect x="714" y="60" width="152" height="180" rx="10" fill="#f7f9fb" stroke="#c9d6e6" stroke-width="1.2"/>
    <circle cx="790" cy="60" r="14" fill="#16385C"/>
    <text x="790" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">5</text>
    <!-- target icon -->
    <g transform="translate(766,84)" fill="none" stroke="#2a78d6" stroke-width="1.6">
      <circle cx="24" cy="26" r="22"/>
      <circle cx="24" cy="26" r="13"/>
      <circle cx="24" cy="26" r="4" fill="#e34948" stroke="#e34948"/>
    </g>
    <text x="790" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#16385C">Evaluate</text>
    <text x="790" y="176" text-anchor="middle" font-size="10.5" fill="#41556E">Bayesian tuning (TPE)</text>
    <text x="790" y="191" text-anchor="middle" font-size="10.5" fill="#41556E">5-fold CV &#183; SHAP</text>
    <text x="790" y="206" text-anchor="middle" font-size="10.5" fill="#41556E">46 automated tests</text>
  </g>

  <!-- ============ STEP 6: delivery ============ -->
  <g>
    <rect x="890" y="60" width="142" height="180" rx="10" fill="#eef8f2" stroke="#9fd4b6" stroke-width="1.2"/>
    <circle cx="961" cy="60" r="14" fill="#1a7a4b"/>
    <text x="961" y="65" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">6</text>
    <!-- dashboard icon -->
    <g transform="translate(936,84)">
      <rect x="0" y="0" width="50" height="36" rx="4" fill="#fff" stroke="#1a7a4b" stroke-width="1.6"/>
      <rect x="8" y="18" width="7" height="12" fill="#2a78d6"/>
      <rect x="20" y="10" width="7" height="20" fill="#1baf7a"/>
      <rect x="32" y="14" width="7" height="16" fill="#eda100"/>
      <line x1="18" y1="44" x2="32" y2="44" stroke="#1a7a4b" stroke-width="1.6"/>
      <line x1="25" y1="36" x2="25" y2="44" stroke="#1a7a4b" stroke-width="1.6"/>
    </g>
    <text x="961" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Deliver</text>
    <text x="961" y="176" text-anchor="middle" font-size="10.5" fill="#2f6247">interactive dashboard,</text>
    <text x="961" y="191" text-anchor="middle" font-size="10.5" fill="#2f6247">this report, audit lists</text>
    <text x="961" y="206" text-anchor="middle" font-size="10.5" fill="#2f6247">for field teams</text>
  </g>

  <!-- research-question ribbon under step 4 -->
  <g font-size="10" fill="#41556E">
    <rect x="362" y="262" width="504" height="40" rx="8" fill="#fff" stroke="#dde5ee" stroke-width="1"/>
    <text x="614" y="279" text-anchor="middle" font-weight="bold" fill="#16385C">Research questions answered</text>
    <text x="614" y="295" text-anchor="middle">RQ1 archetypes &#183; RQ2 sales prediction &#183; RQ3 target-miss risk &#183; RQ4 anomalies</text>
  </g>
  <line x1="614" y1="240" x2="614" y2="262" stroke="#c9d6e6" stroke-width="1.2"/>
</svg>
