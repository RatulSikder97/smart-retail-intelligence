services:
  pipeline:
    build: .
    image: smart-retail:latest
    volumes:
      - ./dataset:/app/dataset:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: python -m smart_retail.pipeline

  dashboard:
    image: smart-retail:latest
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./dataset:/app/dataset:ro
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  test:
    image: smart-retail:latest
    build: .
    volumes:
      - ./dataset:/app/dataset:ro
      - ./tests:/app/tests:ro
    command: pytest -v

  # ---- big-data layer (start with: docker compose --profile spark up -d) ----
  # HDFS (namenode + datanode) is the storage layer; the Spark standalone
  # cluster reads raw data from and writes every phase's output to HDFS.
  # apache/hadoop ships amd64-only — Docker Desktop runs it via Rosetta.
  namenode:
    image: apache/hadoop:3.4.1
    platform: linux/amd64
    profiles: ["spark"]
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-hadoop/dfs/name
      # non-blocking entropy: SecureRandom hangs the namenode under Rosetta
      - HADOOP_OPTS=-Djava.security.egd=file:/dev/./urandom
      - CORE-SITE.XML_fs.default.name=hdfs://namenode:8020
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.namenode.rpc-address=namenode:8020
      - HDFS-SITE.XML_dfs.namenode.rpc-bind-host=0.0.0.0
      - HDFS-SITE.XML_dfs.namenode.servicerpc-bind-host=0.0.0.0
      - HDFS-SITE.XML_dfs.replication=1
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    ports:
      - "9870:9870"   # namenode web UI
      - "8020:8020"   # HDFS RPC (hdfs dfs -fs hdfs://localhost:8020 from host)

  datanode:
    image: apache/hadoop:3.4.1
    platform: linux/amd64
    profiles: ["spark"]
    # horizontal scale via env: DATANODES=3 docker compose --profile spark up -d
    deploy:
      replicas: ${DATANODES:-1}
    command: ["hdfs", "datanode"]
    environment:
      - HADOOP_OPTS=-Djava.security.egd=file:/dev/./urandom
      - CORE-SITE.XML_fs.default.name=hdfs://namenode:8020
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.namenode.rpc-address=namenode:8020
      - HDFS-SITE.XML_dfs.replication=1
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    ports:
      - "9864"        # datanode web UI, auto-assigned host port per replica
    depends_on:
      - namenode

  hdfs-ingest:
    image: apache/hadoop:3.4.1
    platform: linux/amd64
    profiles: ["spark-jobs"]
    command: ["bash", "-c",
      "for i in $(seq 1 30); do hdfs dfs -ls / >/dev/null 2>&1 && break; echo waiting for namenode…; sleep 3; done; hdfs dfs -mkdir -p /smart_retail/raw && hdfs dfs -D dfs.replication=2 -put -f /data/dataset/*.csv /smart_retail/raw/ && hdfs dfs -ls -h /smart_retail/raw"]
    environment:
      - CORE-SITE.XML_fs.default.name=hdfs://namenode:8020
      - CORE-SITE.XML_fs.defaultFS=hdfs://namenode:8020
      - HDFS-SITE.XML_dfs.replication=1
      - HDFS-SITE.XML_dfs.permissions.enabled=false
    depends_on:
      - namenode
      - datanode
    volumes:
      - ./dataset:/data/dataset:ro

  spark-master:
    image: smart-retail-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "7077:7077"   # cluster endpoint
      - "8080:8080"   # master web UI
      - "6066:6066"   # REST submission gateway
    volumes:
      - ./dataset:/data/dataset:ro
      - ./data:/data/out
      - ./spark_jobs:/opt/jobs:ro

  spark-worker:
    image: smart-retail-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      replicas: ${WORKERS:-1}
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
    depends_on:
      - spark-master
    ports:
      - "8081"        # worker web UI, auto-assigned host port per replica
    volumes:
      - ./dataset:/data/dataset:ro
      - ./data:/data/out
      - ./spark_jobs:/opt/jobs:ro

  spark-etl:
    image: smart-retail-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark-jobs"]
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      /opt/jobs/etl_preprocess.py
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ./dataset:/data/dataset:ro
      - ./data:/data/out
      - ./spark_jobs:/opt/jobs:ro

  spark-pipeline:
    image: smart-retail-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark-jobs"]
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --driver-memory 3g
      --conf spark.hadoop.fs.defaultFS=hdfs://namenode:8020
      /opt/jobs/spark_ml_pipeline.py
    ports:
      - "4040:4040"   # live driver UI (stages/DAG) while the job runs
    environment:
      # regional scope, e.g. DIVISIONS=Khulna,Barisal make spark-pipeline
      - DIVISIONS=${DIVISIONS:-}
    depends_on:
      - spark-master
      - spark-worker
      - namenode
      - datanode
    volumes:
      - ./data:/data/out
      - ./spark_jobs:/opt/jobs:ro

  spark-partition:
    image: smart-retail-spark:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark-jobs"]
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --conf spark.hadoop.fs.defaultFS=hdfs://namenode:8020
      /opt/jobs/partition_dataset.py
    depends_on:
      - spark-master
      - spark-worker
      - namenode
      - datanode
    volumes:
      - ./spark_jobs:/opt/jobs:ro
